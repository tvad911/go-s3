<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoS3 Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Elements -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="glass-card login-card">
            <div class="logo-container">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                </div>
                <h1>GoS3 Console</h1>
                <p>Enter your credentials to access the storage</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="endpoint">Endpoint URL</label>
                    <input type="text" id="endpoint" value="http://localhost:9010" required>
                </div>
                <div class="input-group">
                    <label for="access-key">Access Key</label>
                    <input type="text" id="access-key" required>
                </div>
                <div class="input-group">
                    <label for="secret-key">Secret Key</label>
                    <input type="password" id="secret-key" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <span>Connect</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="screen">
        <nav class="sidebar glass-panel">
            <div class="sidebar-header">
                <div class="logo-icon small">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                </div>
                <h2>GoS3</h2>
            </div>
            <ul class="nav-links">
                <li class="active" data-view="buckets">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2v11z"></path></svg>
                    Buckets
                </li>
                <li data-view="users">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    IAM Users
                </li>
                <li data-view="info">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    Server Info
                </li>
            </ul>
            <div class="sidebar-footer">
                <button id="btn-logout" class="btn btn-ghost">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </button>
            </div>
        </nav>

        <main class="main-content">
            <!-- Header -->
            <header class="topbar">
                <div class="breadcrumb" id="breadcrumb">
                    <span>Buckets</span>
                </div>
                <div class="topbar-actions" id="topbar-actions">
                    <!-- Dynamic actions injected here -->
                </div>
            </header>

            <!-- Views -->
            <div class="view-container">
                
                <!-- Buckets View -->
                <div id="view-buckets" class="view active">
                    <div class="grid" id="buckets-grid">
                        <!-- Buckets injected here -->
                        <div class="loading-spinner"></div>
                    </div>
                </div>

                <!-- Objects View -->
                <div id="view-objects" class="view">
                    <div id="upload-zone" class="upload-zone">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <p>Drag & Drop files here or <span>browse</span> to upload</p>
                        <input type="file" id="file-input" multiple hidden>
                    </div>
                    
                    <div class="table-container glass-panel mt-4">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Size</th>
                                    <th>Last Modified</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="objects-table-body">
                                <!-- Objects injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Users View -->
                <div id="view-users" class="view">
                    <div class="glass-panel p-6 mb-6">
                        <h3 class="text-xl mb-4">Create User</h3>
                        <form id="create-user-form" class="flex gap-4">
                            <input type="text" id="new-username" placeholder="Username" required class="flex-1">
                            <button type="submit" class="btn btn-primary">Create</button>
                        </form>
                    </div>

                    <div class="table-container glass-panel">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body">
                                <!-- Users injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Server Info View -->
                <div id="view-info" class="view">
                    <div class="grid cols-2" id="info-grid">
                        <!-- Info injected here -->
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="create-bucket-modal">
        <div class="glass-card modal">
            <div class="modal-header">
                <h3>Create Bucket</h3>
                <button class="btn-close" onclick="closeModal('create-bucket-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="create-bucket-form">
                    <div class="input-group">
                        <label for="new-bucket-name">Bucket Name</label>
                        <input type="text" id="new-bucket-name" pattern="^[a-z0-9.-]+$" required>
                        <span class="hint">Lowercase letters, numbers, dots, and hyphens only.</span>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-ghost" onclick="closeModal('create-bucket-modal')">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
