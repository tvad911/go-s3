server:
  port: 9000
  base_domain: "s3.example.com" # Virtual-hosted style domain (e.g., bucket.s3.example.com)
  tls_cert: ""
  tls_key: ""
  log_level: "info"
  max_header_bytes: 1048576

storage:
  type: "local"
  data_dir: "./data"
  temp_dir: "./data/tmp"
  meta_db: "./data/meta.db"
  max_object_size: 5497558138880

auth:
  root_access_key: "minioadmin"
  root_secret_key: "minioadmin"
  allow_anonymous_read: false

ratelimit:
  enabled: true
  rps: 1000
  burst: 2000
  per_user_enabled: true
  per_user_rps: 100
  per_user_burst: 200

admin:
  ui_enabled: true
  ui_port: 9001

replication:
  enabled: false
  # Uncomment and configure targets to enable cross-node replication:
  # targets:
  #   - endpoint: "http://node2:9000"
  #     access_key: "minioadmin"
  #     secret_key: "minioadmin"
  #     region: "us-east-1"

