services:
  gos3:
    image: tvad9111/gos3:latest
    # Nếu muốn tự build từ mã nguồn, hãy bỏ comment các dòng dưới đây:
    # build: 
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    command: ["-config", "/app/config.yaml"]
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Admin UI (future)
    volumes:
      - gos3-data:/data
      # Uncomment the line below if you want to use a custom config.yaml file instead of ENV vars
      # - ./config.yaml:/app/config.yaml:ro
    environment:
      GOS3_AUTH_ROOT_ACCESS_KEY: minioadmin
      GOS3_AUTH_ROOT_SECRET_KEY: minioadmin
      GOS3_STORAGE_DATA_DIR: /data
      GOS3_STORAGE_TEMP_DIR: /data/tmp
      GOS3_STORAGE_META_DB: /data/meta.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/_health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gos3-data:
